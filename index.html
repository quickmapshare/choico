<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chợ phiên Việt Nam</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #faf7f2;
      color: #2b2b2b;
    }
    main { max-width: 36rem; padding: 0 1rem; text-align: center; }
    h1 { font-size: 1.75rem; margin-bottom: .5rem; }
    p { line-height: 1.6; color: #555; }
    @media (prefers-color-scheme: dark) {
      body { background: #1c1b19; color: #eee; }
      p { color: #bbb; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Chợ phiên Việt Nam</h1>
    <p>Trang đang được xây dựng. Lịch phiên của từng chợ sẽ hiển thị khi dữ liệu đã được xác minh.</p>
  </main>
</body>
</html>
